x-django: &django
  restart: no
  build:
    context: ..
    dockerfile: .docker/Dockerfile
  networks: [ "payment" ]
  env_file: ../.env

x-back-healthcheck: &back-healthcheck
  healthcheck:
    test: [ "CMD-SHELL", "wget -qO- http://localhost:8000/api/v1/health/ | grep -q '^OK$'" ]
    interval: 10s
    timeout: 10s
    retries: 10

x-celery-healthcheck: &celery-healthcheck
  healthcheck:
    test: [ "CMD-SHELL", "celery -A project status" ]
    interval: 10s
    timeout: 10s
    retries: 10

services:
  back:
    command: "run-web"
    container_name: payment_back
    hostname: back
    ports: [ "127.0.0.1:8000:8000" ]
    <<: [ *django, *back-healthcheck ]

  worker:
    command: "run-worker"
    container_name: payment_worker
    <<: [ *django, *celery-healthcheck ]

networks:
  payment:
    external: true
    name: payment
