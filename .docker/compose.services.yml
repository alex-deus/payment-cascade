services:
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
      args:
        - DOMAIN=${DOMAIN}
    container_name: payment_nginx
    restart: on-failure
    networks: [ "payment" ]
    hostname: "nginx"
    ports: [ "80:80", "443:443" ]
    environment:
      - DOMAIN=${DOMAIN}
    volumes: [ "payment_certbot:/etc/letsencrypt" ]

  pg:
    image: postgres:16
    container_name: payment_pg
    networks: [ "payment" ]
    hostname: pg
    ports: [ "127.0.0.1:5432:5432" ]
    volumes: [ "payment_pg:/var/lib/postgresql/data" ]
    environment:
      - POSTGRES_DB=main
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d main" ]
      interval: 10s
      timeout: 10s
      retries: 10

  s3:
    image: quay.io/minio/aistor/minio
    container_name: payment_s3
    command: server /data --license /license --console-address ":9001"
    restart: unless-stopped
    networks: [ "payment" ]
    hostname: "s3"
    ports: [ "127.0.0.1:9000:9000", "127.0.0.1:9001:9001" ]
    environment:
      MINIO_ROOT_USER: user
      MINIO_ROOT_PASSWORD: pass-pass
      MINIO_REGION: us-east-1
    volumes: [ "payment_s3:/data", "./minio/license:/license" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis
    container_name: payment_redis
    restart: unless-stopped
    hostname: redis
    networks: [ "payment" ]
    ports: [ "127.0.0.1:6379:6379" ]
    volumes: [ "payment_redis:/data" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10

  rabbit:
    image: rabbitmq:management
    container_name: payment_rabbit
    restart: unless-stopped
    networks: [ "payment" ]
    hostname: "rabbit"
    ports: [ "127.0.0.1:5672:5672", "127.0.0.1:15672:15672" ]
    volumes:
      - ./rabbit/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./rabbit/definitions.json:/etc/rabbitmq/definitions.json
      - payment_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ "ollama_data:/root/.ollama" ]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: 5m
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: [ "127.0.0.1:6333:6333", "127.0.0.1:6334:6334" ]
    volumes: [ "qdrant_data:/qdrant/storage" ]

volumes:
  payment_pg:
    name: payment_pg
  payment_s3:
    name: payment_s3
  payment_redis:
    name: payment_redis
  payment_rabbitmq:
    name: payment_rabbitmq
  ollama_data:
    name: ollama_data
  qdrant_data:
    name: qdrant_data
  payment_certbot:
    name: payment_certbot
    external: true

networks:
  payment:
    name: payment
