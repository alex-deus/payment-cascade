[project]
name = "admin"
version = "0.1.0"
description = "Stories"
authors = [
    {name = "Aleksei"},
]
requires-python = ">=3.14"
dependencies = [
    # Django core
    "gunicorn>=21.2.0,<22",
    "django>=5.1.3,<6",
    "django-environ>=0.11.2,<1",
    "django-split-settings>=1.2.0,<2",
    "django-solo>=2.2.0,<3",
    "django-cors-headers>=4.3.1,<5",
    "django-ipware>=7.0.1,<8",
    "validators>=0.22.0,<1",
    "jsonschema>=4.21.1,<5",
    "django-essentials-kit>=0.1.6,<1",
    # Database
    "psycopg2-binary>=2.9.9,<3",
    "dj-database-url>=2.1.0,<3",
    # Cache / Redis
    "redis>=5.0.1,<6",
    "django-redis>=5.4.0,<6",
    # REST API
    "django-rest-framework>=0.1.0,<1",
    "django-filter>=23.5,<24",
    "djoser>=2.2.2,<3",
    "drf-yasg>=1.21.7,<2",
    "django-rest-swagger>=2.2.0,<3",
    "drf-extra-fields>=3.7.0,<4",
    "drf-dynamic-fields>=0.4.0,<1",
    "drf-extensions>=0.8.0,<1",
    "coreapi>=2.3.3,<3",
    "python-jose>=3.3.0,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    # Admin
    "django-jsoneditor>=0.2.4,<1",
    "django-admin-rangefilter>=0.12.0,<1",
    "django-admin-sortable2>=2.1.10,<3",
    # Celery / task queue
    "celery>=5.3.6,<6",
    "django-celery-results>=2.5.1,<3",
    "django-celery-beat @ git+https://github.com/celery/django-celery-beat@main",
    "flower>=2.0.1,<3",
    "kombu>=5.3.5,<6",
    # Storage / S3
    "boto3>=1.40.62,<2",
    "django-s3-storage>=0.15.0,<1",
    # Messaging
    "pika>=1.3.2,<2",
    # Monitoring / observability
    "django-prometheus>=2.3.1,<3",
    "sentry-sdk[celery,django]>=2.17.0,<3",
    # Logging
    "json-log-formatter>=1.1.1,<2",
    "python-json-logger>=2.0.7,<3",
]

[dependency-groups]
dev = [
    "pre-commit>=3.6.0,<4",
    "isort>=5.13.2,<6",
    "seed-isort-config>=2.2.0,<3",
    "black>=23.12.1,<24",
    "flake8>=7.0.0,<8",
    "autoflake>=2.2.1,<3",
    "bandit>=1.7.6,<2",
    "parameterized>=0.9.0,<1",
    "mock>=5.1.0,<6",
    "requests-mock>=1.11.0,<2",
    "django-dynamic-fixture>=4.0.1,<5",
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
fixable = ["F401", "I"]

[tool.ruff.lint.isort]
lines-after-imports = 2
force-sort-within-sections = false
known-first-party = ["apps", "project"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
no-lines-before = ["local-folder"]

[tool.ruff.format]
quote-style = "double"
